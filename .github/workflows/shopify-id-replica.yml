name: Shopify CLA identity replica (authorized PoC)
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Classify commit authors like shopify-cla-action
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          PR_OPENER: ${{ github.event.pull_request.user.login }}
        run: |
          set -u
          # Stand-in for https://cla.shopify.com/api/contributor-check?signedUsernames
          # madmath is a confirmed Shopify CLA signee: Shopify/intellij-shadowenv
          # run 40896847227 logged "All authors have signed a CLA. Passing check".
          SIGNEES='["madmath"]'
          authors=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/commits" --paginate \
            --jq '[.[] | (.author.login // empty)] | unique | sort')
          echo "pr_opened_by=${PR_OPENER}"
          echo "commit_authors_resolved=${authors}"
          total=$(jq 'length' <<<"${authors}")
          unsigned=$(jq -n --argjson a "${authors}" --argjson s "${SIGNEES}" '$a - $s | length')
          echo "total=${total} unsigned=${unsigned}"
          if [ "${total}" -eq 0 ] || [ "${unsigned}" -ne 0 ]; then
            echo "RESULT: CLA check FAILED - unsigned commit author(s) present"
            exit 1
          fi
          echo "RESULT: CLA check PASSED - every resolved commit author is a CLA signee"
